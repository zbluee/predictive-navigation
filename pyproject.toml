[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-navigation"
version = "0.1.0"
description = "Small experiments on navigation and predictive learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
     "matplotlib>=3.8,<4"
]

[tool.setuptools.packages.find]
where = ["src"]